name: grocery_delivery_app
description: A customer-facing online food and grocery delivery app.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_storage: ^12.3.3
  firebase_messaging: ^15.1.3
  cloud_functions: ^5.1.3
  provider: ^6.1.2
  google_maps_flutter: ^2.9.0
  geolocator: ^13.0.1
  geocoding: ^3.0.1
  razorpay_flutter: ^1.3.7
  image_picker: ^1.1.2
  cached_network_image: ^3.4.1
  fluttertoast: ^8.2.8
  shared_preferences: ^2.3.2
  intl: ^0.19.0
  lottie: ^3.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
